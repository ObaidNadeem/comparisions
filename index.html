<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>200 Balls — Model Comparison</title>
<style>
  :root {
    --bg: #05060c;
    --panel: rgba(255, 255, 255, 0.03);
    --line: rgba(255, 255, 255, 0.09);
    --text: #f2f4ff;
    --muted: rgba(200, 210, 255, 0.55);
    --luna: #54f7ff;
    --grok: #ff4ea8;
    --sonnet: #ff985c;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
    background:
      radial-gradient(1200px 700px at 15% -10%, rgba(84, 247, 255, 0.10), transparent 60%),
      radial-gradient(1100px 700px at 85% -10%, rgba(255, 78, 168, 0.10), transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 24px;
    padding: 28px clamp(18px, 4vw, 48px) 8px;
    flex-wrap: wrap;
  }

  .titles h1 {
    margin: 0;
    font-size: clamp(22px, 3.4vw, 40px);
    font-weight: 900;
    letter-spacing: -0.02em;
  }

  .titles h1 span { color: var(--muted); font-weight: 700; }

  .titles p {
    margin: 8px 0 0;
    font-size: clamp(12px, 1.2vw, 15px);
    color: var(--muted);
    letter-spacing: 0.02em;
  }

  .controls { display: flex; align-items: center; gap: 12px; }

  .hint {
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }

  button {
    appearance: none;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--text);
    font: inherit;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.02em;
    padding: 10px 18px;
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.2s ease, border-color 0.2s ease, transform 0.1s ease;
  }

  button:hover { background: rgba(255, 255, 255, 0.08); border-color: rgba(255, 255, 255, 0.2); }
  button:active { transform: translateY(1px); }

  main {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: clamp(14px, 1.6vw, 26px);
    padding: clamp(14px, 2vw, 32px) clamp(18px, 4vw, 48px) clamp(28px, 4vw, 56px);
    align-items: start;
  }

  .card {
    display: flex;
    flex-direction: column;
    gap: 12px;
    min-width: 0;
  }

  .meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 0 4px;
  }

  .model {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }

  .dot {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    flex: none;
    box-shadow: 0 0 12px currentColor;
    background: currentColor;
  }

  .name {
    font-weight: 800;
    font-size: clamp(14px, 1.4vw, 18px);
    letter-spacing: -0.01em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .tag {
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    white-space: nowrap;
  }

  .frame {
    position: relative;
    aspect-ratio: 9 / 16;
    width: 100%;
    border-radius: 18px;
    overflow: hidden;
    border: 1px solid var(--line);
    background: #04050a;
    box-shadow: 0 24px 60px -30px rgba(0, 0, 0, 0.9), inset 0 0 0 1px rgba(255, 255, 255, 0.02);
  }

  .frame iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
    background: #04050a;
  }

  .open {
    align-self: flex-start;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    color: var(--muted);
    text-decoration: none;
    padding: 0 4px;
  }

  .open:hover { color: var(--text); }

  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; }
    .frame { aspect-ratio: 9 / 16; max-width: 520px; margin: 0 auto; }
    .card { max-width: 520px; margin: 0 auto; width: 100%; }
  }
</style>
</head>
<body>
  <header>
    <div class="titles">
      <h1>200 BALLS <span>· model showdown</span></h1>
      <p>Three models, one physics prompt: 200 balls in a spinning heptagon — running live, side by side.</p>
    </div>
    <div class="controls">
      <span class="hint">R = restart · click = sound</span>
      <button id="restart" type="button">Restart all</button>
    </div>
  </header>

  <main id="grid">
    <section class="card" style="--accent: var(--luna)">
      <div class="meta">
        <div class="model">
          <span class="dot" style="color: var(--luna)"></span>
          <span class="name">LUNA 6</span>
        </div>
        <span class="tag">gpt-luna-6</span>
      </div>
      <div class="frame">
        <iframe data-src="gpt-luna-6/index.html" title="LUNA 6 — 200 balls simulation" loading="eager"></iframe>
      </div>
      <a class="open" href="gpt-luna-6/index.html" target="_blank" rel="noopener">Open standalone ↗</a>
    </section>

    <section class="card" style="--accent: var(--grok)">
      <div class="meta">
        <div class="model">
          <span class="dot" style="color: var(--grok)"></span>
          <span class="name">GROK 4.7</span>
        </div>
        <span class="tag">grok-4.7</span>
      </div>
      <div class="frame">
        <iframe data-src="grok-4.7/index.html" title="Grok 4.7 — 200 balls simulation" loading="eager"></iframe>
      </div>
      <a class="open" href="grok-4.7/index.html" target="_blank" rel="noopener">Open standalone ↗</a>
    </section>

    <section class="card" style="--accent: var(--sonnet)">
      <div class="meta">
        <div class="model">
          <span class="dot" style="color: var(--sonnet)"></span>
          <span class="name">CLAUDE SONNET 5.5</span>
        </div>
        <span class="tag">sonnet-5.5</span>
      </div>
      <div class="frame">
        <iframe data-src="sonnet-5.5/index.html" title="Claude Sonnet 5.5 — 200 balls simulation" loading="eager"></iframe>
      </div>
      <a class="open" href="sonnet-5.5/index.html" target="_blank" rel="noopener">Open standalone ↗</a>
    </section>
  </main>

  <script>
    const frames = Array.from(document.querySelectorAll('iframe[data-src]'));

    function mount(frame) {
      frame.src = frame.dataset.src;
    }

    frames.forEach(mount);

    document.getElementById('restart').addEventListener('click', () => {
      frames.forEach((frame) => {
        frame.src = 'about:blank';
        requestAnimationFrame(() => mount(frame));
      });
    });
  </script>
</body>
</html>
