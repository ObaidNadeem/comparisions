<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>200 BALLS</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050710}body{display:grid;place-items:center}#stage{position:relative;width:min(100vw,56.25vh);height:min(100vh,177.7778vw);aspect-ratio:9/16;overflow:hidden;flex:none}#stage canvas{display:block!important;width:100%!important;height:100%!important}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
</head>
<body>
<main id="stage" aria-label="1080 by 1920 vertical ball simulation"></main>
<script>
const MODEL_NAME='LUNA 6';
const W=1080,H=1920,N=200,SIDES=7,TAU=Math.PI*2;
const palette=['#54f7ff','#ff58d4','#ffe66d','#91ff75','#9c7bff','#ff985c','#64a7ff'];
const pent=[0,2,4,7,9];
let balls=[], sparks=[], impacts=0, elapsed=0, lastT=0, angle=0, omega=0, radius=700, gravity=0.14, gravityAngle=Math.PI/2, act=0, actT=0;
let energyHistory=[], audioCtx=null, soundOn=false, simTime=0, stepAccumulator=0, zeroGStarted=false;
const acts=[{name:'DROP',duration:6,color:[32,184,222]},{name:'SPIN UP',duration:6,color:[177,62,255]},{name:'ZERO-G',duration:7,color:[255,70,172]},{name:'GRAVITY SLOSH',duration:7,color:[67,235,189]},{name:'CRUSH',duration:6,color:[255,150,55]},{name:'SETTLE',duration:Infinity,color:[82,126,255]}];
function setup(){let canvas=createCanvas(W,H);canvas.parent('stage');pixelDensity(1);colorMode(RGB,255);frameRate(60);resetSim()}
function resetSim(){balls=[];sparks=[];impacts=0;elapsed=0;lastT=millis()/1000;angle=0;omega=.12;radius=520;gravity=.14;gravityAngle=Math.PI/2;act=0;actT=0;energyHistory=[];simTime=0;stepAccumulator=0;zeroGStarted=false;for(let i=0;i<N;i++){let r=18+(i%5)*.45,row=Math.floor(i/10),col=i%10;balls.push({id:i+1,r,x:W/2+(col-4.5)*42+(row%2)*21,y:H*.49-342+row*36,vx:random(-.4,.4),vy:0,a:random(TAU),spin:0,c:color(palette[i%palette.length]),flash:0,trail:[]})}}
function draw(){let now=millis()/1000, dt=Math.min(.05,Math.max(0,now-lastT));lastT=now;elapsed+=dt;updateAct(dt);const fixed=1/120;stepAccumulator=Math.min(stepAccumulator+dt,.1);while(stepAccumulator>=fixed){simulate(fixed);stepAccumulator-=fixed;simTime+=fixed}if(frameCount%3===0)energyHistory.push(kineticEnergy());if(energyHistory.length>160)energyHistory.shift();renderScene()}
function ease(x){x=constrain(x,0,1);return x*x*(3-2*x)}
function updateAct(dt){let t=elapsed, boundaries=[6,12,19,26,32];act=boundaries.findIndex(b=>t<b);if(act<0)act=5;let start=[0,6,12,19,26,32][act];actT=t-start;if(act!==2)zeroGStarted=false;
let targetOmega=[.12,1.35,1.35,.42,.55,.13][act];if(act===1)targetOmega=lerp(.12,1.55,ease(actT/6));if(act===2&&!zeroGStarted){zeroGStarted=true;zeroGExplosion()}
omega=lerp(omega,targetOmega,1-Math.exp(-dt*1.7));
if(act===0)gravity=lerp(gravity,.17,dt*.25);if(act===2)gravity=lerp(gravity,0,1-Math.exp(-dt*5));if(act===3){gravity=lerp(gravity,.19,1-Math.exp(-dt*3));gravityAngle=PI/2+sin(actT*.85)*1.25;}if(act===4){let pulse=.5+.5*cos(actT*TAU/3);radius=lerp(radius,455+65*pulse,1-Math.exp(-dt*4));gravityAngle=lerp(gravityAngle,PI/2,dt*1.5);}if(act===5){gravity=lerp(gravity,.17,1-Math.exp(-dt*1.4));radius=lerp(radius,520,1-Math.exp(-dt*.8));omega=lerp(omega,.1,1-Math.exp(-dt*.6));}}
function zeroGExplosion(){for(const b of balls){let dx=b.x,dy=b.y+70,d=Math.hypot(dx,dy)||1;let impulse=random(3,10);b.vx+=dx/d*impulse+random(-1,1);b.vy+=dy/d*impulse+random(-1,1);b.spin+=random(-.25,.25)}}
function polyVertices(rad=radius,ang=angle){let v=[];for(let i=0;i<SIDES;i++){let a=ang-PI/2+i*TAU/SIDES;v.push({x:W/2+cos(a)*rad,y:H*.49+sin(a)*rad})}return v}
function simulate(dt){angle+=omega*dt;const verts=polyVertices(), cx=W/2,cy=H*.49;
for(const b of balls){b.flash=Math.max(0,b.flash-dt*2.2);b.trail.push({x:b.x,y:b.y});if(b.trail.length>5)b.trail.shift();b.vx+=cos(gravityAngle)*gravity; b.vy+=sin(gravityAngle)*gravity;b.vx*=.9992;b.vy*=.9992;b.x+=b.vx;b.y+=b.vy;b.a+=b.spin;b.spin*=.992;wallCollide(b,verts,cx,cy,dt)}
for(let pass=0;pass<3;pass++)for(let i=0;i<N;i++)for(let j=i+1;j<N;j++)resolvePair(balls[i],balls[j]);
}
function wallCollide(b,v,cx,cy,dt){for(let i=0;i<SIDES;i++){let p=v[i],q=v[(i+1)%SIDES],ex=q.x-p.x,ey=q.y-p.y,len=Math.hypot(ex,ey),nx=-ey/len,ny=ex/len;let inward=(cx-p.x)*nx+(cy-p.y)*ny;if(inward<0){nx=-nx;ny=-ny;inward=-inward}let d=(b.x-p.x)*nx+(b.y-p.y)*ny;if(d<b.r){let penetration=b.r-d;b.x+=nx*penetration;b.y+=ny*penetration;let wallVx=-omega*dt*(b.y-cy),wallVy=omega*dt*(b.x-cx);let rvx=b.vx-wallVx,rvy=b.vy-wallVy,vn=rvx*nx+rvy*ny;if(vn<0){let impulse=-(1+.76)*vn;b.vx+=impulse*nx;b.vy+=impulse*ny;let tx=-ny,ty=nx,vt=(b.vx-wallVx)*tx+(b.vy-wallVy)*ty,fric=constrain(-vt*.11,-.7,.7);b.vx+=fric*tx;b.vy+=fric*ty;b.spin+=fric*.006;if(-vn>3)impact(b,Math.abs(vn),nx,ny)}}}}
function resolvePair(a,b){let dx=b.x-a.x,dy=b.y-a.y,d2=dx*dx+dy*dy,min=a.r+b.r;if(d2>=min*min)return;let d=Math.sqrt(d2)||.001,nx=dx/d,ny=dy/d,overlap=min-d,correction=Math.max(0,overlap-.02)*.52;a.x-=nx*correction;a.y-=ny*correction;b.x+=nx*correction;b.y+=ny*correction;let rvx=b.vx-a.vx,rvy=b.vy-a.vy,vn=rvx*nx+rvy*ny;if(vn<0){let impulse=-(1+.84)*vn/(1/a.r/a.r+1/b.r/b.r);let ia=1/(a.r*a.r),ib=1/(b.r*b.r);a.vx-=impulse*ia*nx;a.vy-=impulse*ia*ny;b.vx+=impulse*ib*nx;b.vy+=impulse*ib*ny;let tx=-ny,ty=nx,vt=(b.vx-a.vx)*tx+(b.vy-a.vy)*ty,fi=constrain(-vt*.045,-.45,.45);a.vx-=fi*tx*ia;a.vy-=fi*ty*ia;b.vx+=fi*tx*ib;b.vy+=fi*ty*ib;a.spin-=fi*.007;b.spin+=fi*.007;if(-vn>2.8){impact(a,-vn,nx,ny);impact(b,-vn,-nx,-ny)}}}
function impact(b,power,nx,ny){impacts++;b.flash=1;if(soundOn&&audioCtx)ping(b.id,power);if(power>4&&sparks.length<900){for(let k=0;k<2&&sparks.length<900;k++)sparks.push({x:b.x+nx*b.r*.6,y:b.y+ny*b.r*.6,vx:nx*random(1,4)+random(-2,2),vy:ny*random(1,4)+random(-2,2),life:random(.18,.45),max:.45,c:b.c})}}
function ping(id,power){try{let osc=audioCtx.createOscillator(),gain=audioCtx.createGain(),freq=220*Math.pow(2,pent[(id-1)%5]/12)*Math.pow(2,Math.floor((id-1)/5)%3);osc.type='sine';osc.frequency.value=freq;gain.gain.setValueAtTime(Math.min(.11,.025+power*.003),audioCtx.currentTime);gain.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.12);osc.connect(gain);gain.connect(audioCtx.destination);osc.start();osc.stop(audioCtx.currentTime+.13)}catch(e){}}
function kineticEnergy(){let e=0;for(const b of balls)e+=(b.vx*b.vx+b.vy*b.vy)*.5;return e}
function renderScene(){let ac=acts[act],col=ac.color;background(5,7,16);noStroke();for(let r=650;r>0;r-=8){let alpha=map(r,650,0,0,10);fill(col[0],col[1],col[2],alpha);ellipse(W/2,H*.53,r*2.6,r*2.6)}
// subtle scan lines
stroke(255,7);for(let y=0;y<H;y+=12)line(0,y,W,y);noStroke();drawContainer();for(const b of balls)drawBall(b);drawSparks();drawHUD(ac)}
function drawContainer(){let v=polyVertices();drawingContext.save();drawingContext.shadowBlur=34;drawingContext.shadowColor='#68faff';for(let echo=3;echo>=0;echo--){let rr=radius+echo*11,alpha=echo===0?235:35;stroke(92,245,255,alpha);strokeWeight(echo===0?5:2);noFill();beginShape();for(let i=0;i<SIDES;i++){let a=angle-PI/2+i*TAU/SIDES;vertex(W/2+cos(a)*rr,H*.49+sin(a)*rr)}endShape(CLOSE)}drawingContext.restore();for(let i=0;i<SIDES;i++){let a=v[i],b=v[(i+1)%SIDES];stroke(181,255,255,60);strokeWeight(1);line(a.x,a.y,b.x,b.y)}}
function drawBall(b){noStroke();for(let i=0;i<b.trail.length;i++){let t=b.trail[i],alpha=map(i,0,b.trail.length-1,4,24);fill(red(b.c),green(b.c),blue(b.c),alpha);ellipse(t.x,t.y,b.r*1.25,b.r*1.25)}drawingContext.save();drawingContext.shadowBlur=10+b.flash*24;drawingContext.shadowColor=b.flash?'#ffffff':b.c.toString();fill(b.c);ellipse(b.x,b.y,b.r*2,b.r*2);drawingContext.restore();noStroke();fill(255,80);ellipse(b.x-b.r*.28,b.y-b.r*.32,b.r*.62,b.r*.4);fill(4,8,18,90);ellipse(b.x+b.r*.22,b.y+b.r*.28,b.r*1.35,b.r*1.15);push();translate(b.x,b.y);rotate(0);fill(255);textAlign(CENTER,CENTER);textStyle(BOLD);textSize(b.id<10?13: b.id<100?11:9);text(b.id,0,1);pop()}
function drawSparks(){for(let i=sparks.length-1;i>=0;i--){let s=sparks[i];s.x+=s.vx;s.y+=s.vy;s.vx*=.96;s.vy*=.96;s.life-=1/60;stroke(red(s.c),green(s.c),blue(s.c),255*max(0,s.life/s.max));strokeWeight(2);line(s.x,s.y,s.x-s.vx*2,s.y-s.vy*2);if(s.life<=0)sparks.splice(i,1)}noStroke()}
function drawHUD(ac){const margin=66;fill(255);textAlign(LEFT,TOP);textStyle(BOLD);textSize(23);fill(144,166,195);text('SIMULATION LAB  /  LIVE PHYSICS',margin,55);noStroke();fill(20,32,52,230);rect(W-250,48,184,46,23);stroke(72,239,255,150);noFill();rect(W-250,48,184,46,23);noStroke();fill(160,249,255);textAlign(CENTER,CENTER);textSize(20);text(MODEL_NAME,W-158,71);
textAlign(CENTER,TOP);fill(255);textSize(78);textStyle(BOLD);text('200 BALLS',W/2,130);fill(149,179,211);textSize(23);textStyle(NORMAL);text('A ROTATING HEPTAGON EXPERIMENT',W/2,221);
const panelY=H-320;fill(8,14,28,220);stroke(91,216,255,55);strokeWeight(1);rect(margin,panelY,W-2*margin,224,24);noStroke();fill(ac.color[0],ac.color[1],ac.color[2]);textAlign(LEFT,TOP);textStyle(BOLD);textSize(25);text(ac.name,margin+28,panelY+24);fill(130,153,182);textStyle(NORMAL);textSize(18);text('ACT '+(act+1)+' / 6',W-margin-142,panelY+29);fill(31,45,63);rect(margin+28,panelY+69,W-2*margin-56,7,4);fill(ac.color[0],ac.color[1],ac.color[2]);let duration=ac.duration===Infinity?8:ac.duration;rect(margin+28,panelY+69,(W-2*margin-56)*constrain(actT/duration,0,1),7,4);
fill(179,200,222);textSize(17);text('COLLISIONS',margin+28,panelY+95);fill(255);textStyle(BOLD);textSize(32);text(impacts.toLocaleString(),margin+28,panelY+122);drawGraph(margin+280,panelY+103,350,86);fill(179,200,222);textStyle(NORMAL);textSize(17);text('KINETIC ENERGY',margin+280,panelY+91);text('TIME',W-margin-150,panelY+95);fill(255);textStyle(BOLD);textSize(29);text(formatTime(elapsed),W-margin-150,panelY+129);
fill(101,130,162);textAlign(CENTER,CENTER);textStyle(NORMAL);textSize(16);text('CLICK TO ENABLE SOUND  ·  R TO RESTART',W/2,H-52);}
function drawGraph(x,y,w,h){noFill();stroke(90,119,151,75);strokeWeight(1);rect(x,y,w,h,8);stroke(83,240,255,220);strokeWeight(2);beginShape();let maxV=Math.max(100, ...energyHistory);for(let i=0;i<energyHistory.length;i++)vertex(x+i/(159)*w,y+h-map(energyHistory[i],0,maxV,2,h-4));endShape();noStroke()}
function formatTime(t){let m=Math.floor(t/60),s=Math.floor(t%60),cs=Math.floor((t%1)*100);return nf(m,2)+':'+nf(s,2)+'.'+nf(cs,2)}
function mousePressed(){if(!soundOn){audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();soundOn=true}return false}
function keyPressed(){if(key==='r'||key==='R')resetSim()}
</script>
</body>
</html>
